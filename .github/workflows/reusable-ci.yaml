name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# TODO: Add a browser-based test-wasm job. https://github.com/mrkjdy/sudoku_machine/issues/138
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain
        with:
          profile: minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-ci
          cache-on-failure: true
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev
      - name: Run cargo test
        run: cargo test

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain
        with:
          profile: minimal
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-ci
          cache-on-failure: true
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev
      - name: Run clippy
        run: cargo clippy -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain
        with:
          profile: minimal
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all --check

  lint_github:
    name: Actionlint + Shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check GitHub Actions workflows
        run: actionlint -shellcheck shellcheck
      - name: Check .github shell scripts
        shell: bash
        run: git ls-files -z -- ':(glob).github/**/*.sh' | xargs -0 -r shellcheck
