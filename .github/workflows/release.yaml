name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: release-${{ (github.event.action != 'labeled' || github.event.label.name == 'requires:release-dry-run') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.releases_created == 'true' && fromJSON(steps.release.outputs.releases)[0].tag || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain
        with:
          profile: minimal
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev libudev-dev
      - name: Run release-plz
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  plan-release:
    name: Plan release
    needs: release-plz-release
    # The cancellation check lets PR previews proceed with draft creation skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - name: Select release mode
        id: plan
        shell: bash
        env:
          DRAFT_RESULT: ${{ needs.release-plz-release.result }}
          DRAFT_TAG: ${{ needs.release-plz-release.outputs.release_tag }}
        run: |
          mode=skip
          tag=''
          reason='This event does not request a release.'

          case "$GITHUB_EVENT_NAME" in
            push)
              if [[ "$DRAFT_RESULT" != success ]]; then
                reason="Draft creation finished with status $DRAFT_RESULT."
              elif [[ -n "$DRAFT_TAG" ]]; then
                mode=release
                tag="$DRAFT_TAG"
                reason="Package and publish draft $tag."
              else
                reason='Release-plz did not create a draft.'
              fi
              ;;
            pull_request)
              dry_run="$(jq --raw-output --arg label 'requires:release-dry-run' '
                if .action == "labeled" then
                  ((.label.name // "") | ascii_downcase) == $label
                else
                  any(.pull_request.labels[]?; (.name | ascii_downcase) == $label)
                end
              ' "$GITHUB_EVENT_PATH")"
              if [[ "$dry_run" == true ]]; then
                mode=dry-run
                reason='Package this pull request and preview the release assets.'
              else
                reason='This pull request event did not request a release dry run.'
              fi
              ;;
          esac

          printf 'mode=%s\nrelease_tag=%s\n' "$mode" "$tag" >> "$GITHUB_OUTPUT"
          printf '## Release plan (%s)\n\n%s\n' "$mode" "$reason" >> "$GITHUB_STEP_SUMMARY"

  build-packages:
    name: Package platforms
    needs: plan-release
    if: >-
      !cancelled() && needs.plan-release.result == 'success' &&
      (needs.plan-release.outputs.mode == 'release' || needs.plan-release.outputs.mode == 'dry-run')
    uses: ./.github/workflows/build.yaml
    with:
      mode: package
      ref: >-
        ${{ needs.plan-release.outputs.release_tag
            && format('refs/tags/{0}', needs.plan-release.outputs.release_tag) || '' }}
      sign: ${{ needs.plan-release.outputs.mode == 'release' }}
    secrets:
      MACOS_BUILD_CERTIFICATE_BASE64: ${{ needs.plan-release.outputs.mode == 'release' && secrets.MACOS_BUILD_CERTIFICATE_BASE64 || '' }}
      MACOS_P12_PASSWORD: ${{ needs.plan-release.outputs.mode == 'release' && secrets.MACOS_P12_PASSWORD || '' }}
      MACOS_KEYCHAIN_PASSWORD: ${{ needs.plan-release.outputs.mode == 'release' && secrets.MACOS_KEYCHAIN_PASSWORD || '' }}

  preview-release:
    name: Preview GitHub Release
    if: >-
      !cancelled() && needs.build-packages.result == 'success' && needs.plan-release.outputs.mode == 'dry-run'
    needs: [plan-release, build-packages]
    runs-on: ubuntu-latest
    env:
      package_name: ${{ needs.build-packages.outputs.package_name }}
      RELEASE_TAG: ${{ format('dry-run-pr-{0}', github.event.pull_request.number) }}
    steps:
      - &download_packages
        uses: actions/download-artifact@v8
        with:
          path: packages
      - &stage_release_assets
        name: Stage release assets
        shell: bash
        run: |
          asset_version="${RELEASE_TAG//\//-}"
          mkdir release-assets
          for platform in wasm linux windows; do
            mv "packages/$platform/$package_name.zip" \
              "release-assets/$package_name-$platform-$asset_version.zip"
          done
          for arch in apple-silicon intel; do
            mv "packages/macOS-$arch/$package_name-macOS-$arch.dmg" \
              "release-assets/$package_name-macOS-$arch-$asset_version.dmg"
          done
      - name: Summarize release assets
        run: |
          {
            echo '## Release dry run'
            echo
            echo 'This run staged all five packages for a preview.'
            for asset in release-assets/*; do
              printf -- "- \`%s\`\n" "${asset##*/}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish GitHub Release
    needs: [plan-release, build-packages]
    if: >-
      !cancelled() && needs.build-packages.result == 'success' && needs.plan-release.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.plan-release.outputs.release_tag }}
    env:
      package_name: ${{ needs.build-packages.outputs.package_name }}
      RELEASE_TAG: ${{ needs.plan-release.outputs.release_tag }}
    steps:
      - *download_packages
      - *stage_release_assets
      - name: Upload packages and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view --json isDraft --jq .isDraft -- "$RELEASE_TAG")" != true ]]; then
            echo "::error::Expected a draft GitHub Release for $RELEASE_TAG"
            exit 1
          fi
          gh release upload --clobber -- "$RELEASE_TAG" release-assets/*
          gh release edit --draft=false -- "$RELEASE_TAG"

  deploy-to-github-pages:
    name: Deploy to GitHub Pages
    needs: [build-packages, publish-release]
    if: "!cancelled() && needs.publish-release.result == 'success'"
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      package_name: ${{ needs.build-packages.outputs.package_name }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: wasm
      - run: unzip "$package_name.zip" -d wasm-artifact
      - uses: actions/upload-pages-artifact@v5
        with:
          path: wasm-artifact
      - id: deployment
        uses: actions/deploy-pages@v5
